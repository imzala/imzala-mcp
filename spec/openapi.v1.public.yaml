  /api/v1/demands/{id}/parties/{partyId}/resend:
    post:
      tags:
        - Demands
      summary: Tekil tarafa imza davetini tekrar gönder
      x-required-scope: demands:write
      description: |
        Belirtilen tarafa imza davetini (SMS/e-posta/WhatsApp, sözleşme
        ayarına göre) tekrar gönderir. İmzalamış/reddetmiş tarafa, onayını
        vermiş onaylayana, açık düzeltme talebi olan tarafa veya sıralı imzada
        sırası gelmemiş tarafa gönderilemez (409). Sıralı imzada onaylayanın onayı o adımı tamamlar;
        sıra bir sonraki tarafa geçer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Gönderildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sent:
                        type: array
                        items:
                          type: string
                        description: Gönderilen kanallar (sms/email/whatsapp)
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Tekrar gönderim yapılamaz. `error` insan-okur mesajı taşır.
            - İmzalamış veya reddetmiş taraf (`code` alanı yok)
            - `CHANGE_REQUEST_PENDING`: tarafın açık bir düzeltme talebi var;
              talep çözüldükten sonra tekrar gönderilebilir
            - `PARTY_NOT_ELIGIBLE`: tarafa şu an davet gönderilemez. Şu
              durumlarda döner: taraf zaten onay vermiş bir onaylayan
              olduğunda, sözleşme bir onaylayanın reddiyle durdurulduğunda,
              onaylayan katmanının onayı tamamlanmadan imzacıya gönderim
              denendiğinde veya sıralı imzada henüz bu tarafın sırası
              gelmediğinde.
            - `DEMAND_NOT_DISPATCHED`: sözleşme henüz imzaya gönderilmedi (taslak)
            - `DEMAND_NOT_DISPATCHABLE`: sözleşme tamamlanmış veya iptal edilmiş
            - `DEMAND_EXPIRED`: sözleşmenin imza süresi geçmiş
            - `ENVELOPE_NOT_DISPATCHED`: çok belgeli zarf henüz gönderilmedi.
              Önce `POST /demands/{id}/dispatch` çağırın; tek belgeli ve
              gönderilmiş sözleşmelerde bu kod hiç dönmez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedError'
        '429':
          description: |
            İki ayrı sınır vardır.

            `TOO_MANY_REQUESTS`: API anahtarı başına saatte 300 istek (dispatch
            ucuyla ortak sınır). Gövdede `retry_after_seconds` döner.

            `RECIPIENT_RESEND_LIMIT`: aynı alıcıya saatte en fazla 3, günde en
            fazla 10 davet tekrarı gönderilebilir.
  /api/v1/demands/{demandId}/documents:
    get:
      tags:
        - Demands
      summary: Zarf belge listesi
      x-required-scope: demands:read
      description: |
        Çok-belgeli imza zarfının belge listesini döner.

        🔴 Bu uç ve aşağıdaki tüm `/documents*` + `/documents/{docId}*` +
        `/documents/{docId}/assignments` uçları `ENVELOPE_DECISION_ENFORCE`
        bayrağı **arkasındadır**; bayrak kapalıyken **409
        `ENVELOPE_MULTI_DOC_DISABLED`** döner. Bu, dashboard'un davranışından
        BİLEREK daha katıdır: dashboard yalnız yazma uçlarını kapatır, burada
        okuma da kapalıdır — kademeli açılış tamamlanmadan dış API çağıranına
        kararsız/tek-belgeye-indirgenmiş bir zarf durumu hiç gösterilmez.

        Belge uçları **kredi düşmez**; tahsilat yalnızca
        `POST /demands/{demandId}/dispatch` çağrıldığında yapılır.

        Varsayılan yanıt daraltılmış özet şeklidir. `?view=wizard` verilirse
        tam şekil döner (`EnvelopeDocument` şemasındaki alan notlarına bakın).
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: view
          in: query
          schema:
            type: string
            enum:
              - wizard
          description: '`wizard` → tam DTO (`assigned_party_ids` + `decision_count` dahil).'
      responses:
        '200':
          description: Belge listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      documents:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnvelopeDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ENVELOPE_MULTI_DOC_DISABLED` — çok-belgeli zarf yüzeyi bu hesap için henüz kapalı.'
    post:
      tags:
        - Demands
      summary: Zarfa metadata-only belge ekle
      x-required-scope: demands:write
      description: |
        Zarfa dosyasız (yalnız metadata) yeni bir belge satırı ekler; sıra
        numarası otomatik atanır (mevcut belge sayısı + 1). Dosyalı yükleme
        AYRI bir uçtur: `POST /demands/{demandId}/documents/upload`.

        Belge uçları kredi düşmez; tahsilat `POST /dispatch`'te yapılır.
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  description: Belge başlığı. Boş olamaz.
                doc_kind:
                  type: string
                  enum:
                    - CONTRACT
                    - KVKK_NOTICE
                    - KVKK_CONSENT
                    - PREINFO
                    - PRICE_LIST
                    - OTHER
                  default: OTHER
                  description: |
                    `KVKK_CONSENT` ile `is_required: true` **birlikte
                    gönderilemez** (400 `CONSENT_CANNOT_BE_REQUIRED` — açık
                    rıza reddedilebilir olmak zorundadır). `PREINFO` ile
                    `is_required: false` **birlikte gönderilemez** (400
                    `PREINFO_MUST_BE_REQUIRED`).
                is_required:
                  type: boolean
                  default: true
                signature_required:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Belge oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      document:
                        $ref: '#/components/schemas/EnvelopeDocument'
        '400':
          description: |
            `VALIDATION_FAIL` — başlık boş. `INVALID_DOC_KIND` — geçersiz
            `doc_kind`. `CONSENT_CANNOT_BE_REQUIRED` / `PREINFO_MUST_BE_REQUIRED`
            — yukarı bakın. `DOCUMENT_LIMIT_EXCEEDED` — zarf başına en fazla
            20 belge. `QES_NOT_SUPPORTED_MULTI_DOCUMENT` — NES/Mobil İmza açık
            (`enable_qes`) bir sözleşmede ikinci belge eklenemez.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `ENVELOPE_MULTI_DOC_DISABLED` — bayrak kapalı.
            `DEMAND_NOT_EDITABLE` — sözleşme düzenlemeye açık değil (iptal/
            süresi geçmiş/bulunamadı). `SIGNING_ALREADY_STARTED` — imza
            süreci başlamış zarfın belge listesi değiştirilemez (biri
            görüntülemiş/imzalamış/karar vermiş). `ENVELOPE_ALREADY_DISPATCHED`:
            sözleşme gönderilmiş (yayına alınmış veya en az bir tarafa
            davet gitmiş); gönderilmiş bir zarfa belge eklenemez.
  /api/v1/demands/{demandId}/documents/upload:
    post:
      tags:
        - Demands
      summary: Zarfa dosya yükle (belge başına tek dosya)
      x-required-scope: demands:write
      description: |
        Zarfa **belge başına tek dosya** yükler. Aynı sözleşmeye birden çok
        belge eklemek için bu uç birden çok kez çağrılır — tek istekte N
        belge YASAKTIR.

        `idempotency_key` **zorunludur** (gövde alanı; `Idempotency-Key`
        HEADER'ı ile KARIŞTIRILMAZ, ayrı bir mekanizmadır). Aynı
        `(demandId, idempotency_key)` çifti ile tekrar çağrı **409
        `IDEMPOTENT_REPLAY`** döner ve **yeni belge YARATILMAZ**; yanıt
        gövdesinde daha önce yüklenen belgenin DTO'su döner.

        Belge uçları kredi düşmez; tahsilat `POST /dispatch`'te yapılır.
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - idempotency_key
                - title
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF/DOC/DOCX/ODT/RTF/TXT veya görsel. Tek dosya.
                idempotency_key:
                  type: string
                  description: Zorunlu tekrar-koruma anahtarı.
                title:
                  type: string
                doc_kind:
                  type: string
                  enum:
                    - CONTRACT
                    - KVKK_NOTICE
                    - KVKK_CONSENT
                    - PREINFO
                    - PRICE_LIST
                    - OTHER
                  default: OTHER
                is_required:
                  type: string
                  enum:
                    - 'true'
                    - 'false'
                  default: 'true'
                  description: Multipart alanı — string olarak gönderilir.
      responses:
        '200':
          description: Belge yüklendi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      document:
                        $ref: '#/components/schemas/EnvelopeDocument'
        '400':
          description: '`VALIDATION_FAIL` (dosya/idempotency_key/başlık eksik) veya `INVALID_DOC_KIND`.'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `ENVELOPE_MULTI_DOC_DISABLED` — bayrak kapalı.
            `IDEMPOTENT_REPLAY` — aynı `idempotency_key` daha önce kullanıldı,
            yeni belge yaratılmaz (gövdede mevcut belgenin `document`'ı döner).
            `DEMAND_NOT_EDITABLE` / `SIGNING_ALREADY_STARTED` /
            `ENVELOPE_ALREADY_DISPATCHED`: bkz. yukarıdaki uç.
        '413':
          description: '`FILE_TOO_LARGE` — 20 MB sınırı.'
        '415':
          description: Desteklenmeyen dosya türü.
        '422':
          description: '`IMAGE_DECODE_FAILED` — görsel çözümlenemedi.'
