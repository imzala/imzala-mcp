          $ref: '#/components/responses/Unauthorized'
        '403':
          description: INSUFFICIENT_SCOPE — API key'de contacts:read scope yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
        - Contacts
      summary: Kişi oluştur
      x-required-scope: contacts:write
      description: |
        Workspace'e yeni bir kişi ekler. Aynı workspace'te aynı e-posta veya
        telefona sahip aktif bir kişi varsa 409 (CONTACT_DUPLICATE) döner.

        🔴 KVKK: 3. kişilere ait kişisel veriyi (ad/e-posta/telefon/TC) buraya
        yazan API key sahibi, o veri için veri sorumlusudur; aydınlatma ve
        hukuki dayanak yükümlülüğü kendisine aittir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                  nullable: true
                phone:
                  type: string
                  nullable: true
                job_title:
                  type: string
                  nullable: true
                company_id:
                  type: string
                  format: uuid
                  nullable: true
                notes:
                  type: string
                  nullable: true
                address_country:
                  type: string
                  nullable: true
                address_city:
                  type: string
                  nullable: true
                address_district:
                  type: string
                  nullable: true
                address_line:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Kişi oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ContactSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: INSUFFICIENT_SCOPE — API key'de contacts:write scope yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: CONTACT_DUPLICATE — aynı e-posta/telefona sahip kişi zaten var
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
webhooks:
  demand.created:
    post:
      tags:
        - Webhooks
      summary: Sözleşme oluşturuldu
      description: |
        Yeni bir sözleşme oluşturulduğunda (dashboard, API veya şablon kullanımı
        ile) tetiklenir. Sözleşme henüz `PENDING` (taraflar imza bekliyor) olabilir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - demand.created
                    data:
                      $ref: '#/components/schemas/WebhookDataDemandCreated'
            example:
              id: evt_3a8f9c2b1d4e5f6a7b8c9d0e1f2a3b4c
              type: demand.created
              created_at: '2026-05-07T10:15:00.000Z'
              data:
                demand_id: 9d08ed88-1234-5678-90ab-cdef12345678
                title: Vize Danışmanlığı - Ayşe Yılmaz
      responses:
        '200':
          description: Webhook alındı (2xx döndürün; aksi halde retry tetiklenir)
  demand.completed:
    post:
      tags:
        - Webhooks
      summary: Sözleşme tamamlandı
      description: |
        Sözleşmedeki tüm taraflar imzaladığında tetiklenir.
        `data.parties[]` her tarafın imza zamanını içerir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - demand.completed
                    data:
                      $ref: '#/components/schemas/WebhookDataDemandCompleted'
            example:
              id: evt_5b9d8e3c2a1f4e6d7c8b9a0e1f2d3c4b
              type: demand.completed
              created_at: '2026-05-07T11:42:30.124Z'
              data:
                demand_id: 9d08ed88-1234-5678-90ab-cdef12345678
                title: Vize Danışmanlığı - Ayşe Yılmaz
                status: COMPLETED
                completed_at: '2026-05-07T11:42:30.000Z'
                parties:
                  - id: 8e74a3b1-c2d4-5e6f-7a8b-9c0d1e2f3a4b
                    name: Ayşe Yılmaz
                    email: ayse@example.com
                    signed_at: '2026-05-07T10:32:11.000Z'
                  - id: 7d63b2a0-d3e5-4f6e-8b9c-0d1e2f3a4b5c
                    name: Mehmet Yılmaz
                    email: mehmet@example.com
                    signed_at: '2026-05-07T11:42:29.000Z'
      responses:
        '200':
          description: Webhook alındı
  demand.expired:
    post:
      tags:
        - Webhooks
      summary: Sözleşme süresi doldu
      description: |
        Sözleşmenin `expiry_date`'i geçtiğinde ve hala tüm taraflar imzalamadıysa
        tetiklenir. ExpiryWorker tarafından arka planda yapılır.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - demand.expired
                    data:
                      $ref: '#/components/schemas/WebhookDataDemandExpired'
            example:
              id: evt_2c4e6f8a1b3d5c7e9f0a2b4d6c8e0f1a
              type: demand.expired
              created_at: '2026-05-07T23:59:01.000Z'
              data:
                demand_id: 9d08ed88-1234-5678-90ab-cdef12345678
                title: Kira Sözleşmesi - Mayıs 2026
                expiry_date: '2026-05-07T23:59:00.000Z'
                parties:
                  - id: 8e74a3b1-c2d4-5e6f-7a8b-9c0d1e2f3a4b
                    name: Ali Yılmaz
                    email: ali@example.com
                    signed: true
                  - id: 7d63b2a0-d3e5-4f6e-8b9c-0d1e2f3a4b5c
                    name: Veli Demir
                    email: veli@example.com
                    signed: false
      responses:
        '200':
          description: Webhook alındı
  party.signed:
    post:
      tags:
        - Webhooks
      summary: Bir taraf imzaladı
      description: |
        Sözleşmedeki bir taraf imza işlemini tamamladığında tetiklenir
        (sayfayı kapatsa da imza kayıtlı). Tüm taraflar imzaladığında
        ayrıca `demand.completed` da tetiklenir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - party.signed
                    data:
                      $ref: '#/components/schemas/WebhookDataPartySigned'
            example:
              id: evt_4d6f8a0c2e4b6d8f0a2c4e6b8d0f2a4c
              type: party.signed
              created_at: '2026-05-07T10:32:11.500Z'
              data:
                demand_id: 9d08ed88-1234-5678-90ab-cdef12345678
                party_id: 8e74a3b1-c2d4-5e6f-7a8b-9c0d1e2f3a4b
      responses:
        '200':
          description: Webhook alındı
  party.viewed:
    post:
      tags:
        - Webhooks
      summary: Bir taraf imza sayfasını ilk kez açtı
      description: |
        Bir taraf, kendi imza linkini (örn. `https://e.imzala.org/imza/<party_id>`)
        **ilk kez** açtığında tetiklenir. Aynı taraf birden fazla kez açarsa
        sadece ilk açılışta tetiklenir.

        > **Not:** Bu olay yoğun trafiklı entegrasyonlarda gürültülü olabilir;
        > yalnızca açılış metriği toplamak istiyorsanız aboneliğin sürdürülmesi
        > önerilir, aksi halde devre dışı bırakabilirsiniz.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - party.viewed
                    data:
                      $ref: '#/components/schemas/WebhookDataPartyViewed'
            example:
              id: evt_6f8a0c2e4b6d8f0a2c4e6b8d0f2a4c6e
              type: party.viewed
              created_at: '2026-05-07T10:25:00.000Z'
              data:
                demand_id: 9d08ed88-1234-5678-90ab-cdef12345678
                party_id: 8e74a3b1-c2d4-5e6f-7a8b-9c0d1e2f3a4b
      responses:
        '200':
          description: Webhook alındı
  party.rejected:
    post:
      tags:
        - Webhooks
      summary: Bir taraf reddetti
      description: |
        Bir taraf imza sayfasındaki "Reddet" butonu ile sözleşmeyi reddettiğinde
        tetiklenir. Sebep opsiyoneldir (`data.party.rejection_reason`).
        Reddedilen sözleşme `CANCELLED` durumuna geçmez (mevcut akışta sadece
        o tarafın katılımı işaretlenir; gönderen kişi sözleşmeyi manuel iptal
        edebilir).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - party.rejected
                    data:
                      $ref: '#/components/schemas/WebhookDataPartyRejected'
            example:
              id: evt_8a0c2e4b6d8f0a2c4e6b8d0f2a4c6e8b
              type: party.rejected
              created_at: '2026-05-07T10:40:15.000Z'
              data:
                demand_id: 9d08ed88-1234-5678-90ab-cdef12345678
                party:
                  id: 8e74a3b1-c2d4-5e6f-7a8b-9c0d1e2f3a4b
                  first_name: Ayşe
                  last_name: Yılmaz
                  email: ayse@example.com
                  rejection_reason: Tutar yanlış, lütfen düzeltip yeniden gönderin.
                rejected_at: '2026-05-07T10:40:14.000Z'
      responses:
        '200':
          description: Webhook alındı
  kyc.completed:
    post:
      tags:
        - Webhooks
      summary: Kimlik doğrulama tamamlandı (KYC)
      description: |
        Bağımsız KYC doğrulaması terminal ve **başarılı** sonuca ulaştığında
        tetiklenir. Payload PII taşımaz: TCKN, telefon ve kart görüntüleri
        webhook gövdesinde ASLA yer almaz. Yalnız doğrulama kimliği, kullanılan
        yöntemler ve adım sonuçları döner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/KycWebhookEnvelope'
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - kyc.completed
                    data:
                      $ref: '#/components/schemas/WebhookDataKycTerminal'
            example:
              id: evt_1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
              type: kyc.completed
              created_at: '2026-09-08T09:12:00.000Z'
              data:
                id: 3f2a9c11-4d5e-6f70-8192-a3b4c5d6e7f8
                verified: true
                methods:
                  - id_card
                  - phone_otp
                steps:
                  - method: id_card
                    verified: true
                  - method: phone_otp
                    verified: true
                external_ref: siparis-2026-0042
      responses:
        '200':
          description: Webhook alındı
  kyc.failed:
    post:
      tags:
        - Webhooks
      summary: Kimlik doğrulama başarısız (KYC)
      description: |
        Bağımsız KYC doğrulaması terminal ve **başarısız** sonuca ulaştığında
        tetiklenir (adım reddi, deneme hakkının tükenmesi, eşleşmeme).
        `data.steps[]` hangi adımın düştüğünü gösterir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/KycWebhookEnvelope'
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - kyc.failed
                    data:
                      $ref: '#/components/schemas/WebhookDataKycTerminal'
            example:
              id: evt_9f8e7d6c5b4a39281706f5e4d3c2b1a0
              type: kyc.failed
              created_at: '2026-09-08T09:20:41.000Z'
              data:
                id: 3f2a9c11-4d5e-6f70-8192-a3b4c5d6e7f8
                verified: false
                methods:
                  - id_card
                steps:
                  - method: id_card
                    verified: false
                external_ref: null
      responses:
        '200':
          description: Webhook alındı
  contract.expiring:
    post:
      tags:
        - Webhooks
      summary: Sözleşme bitiş tarihi yaklaşıyor
      description: |
        Takip edilen bir sözleşmenin bitiş tarihi, sözleşmede tanımlı
        hatırlatma penceresine (`reminder_offsets`, gün sayısı olarak) veya
        ihbar son gününe (`notice_deadline`) girdiğinde tetiklenir.

        **Platform takip kaydıdır; sözleşmenin hukuken yenilendiğini veya
        sona erdiğini belirtmez.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - contract.expiring
                    data:
                      $ref: '#/components/schemas/WebhookDataContractTerm'
            example:
              id: evt_a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
              type: contract.expiring
              created_at: '2026-09-25T04:00:00.000Z'
              data:
                demand_id: 9d08ed88-1234-5678-90ab-cdef12345678
                term_end_date: '2026-10-15'
                renewal_type: AUTO_RENEW
                notice_deadline: '2026-09-30'
                term_state: ACTIVE
                due_key: reminder:end:30
      responses:
        '200':
          description: Webhook alındı
  contract.ended:
    post:
      tags:
        - Webhooks
      summary: Takip edilen bitiş tarihi geçti
      description: |
        Sabit süreli (`renewal_type: FIXED_TERM`) takip edilen bir
        sözleşmenin platformda kayıtlı bitiş tarihi geçtiğinde tetiklenir.

        **Platform takip kaydıdır; sözleşmenin hukuken yenilendiğini veya
        sona erdiğini belirtmez.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - contract.ended
                    data:
                      $ref: '#/components/schemas/WebhookDataContractTerm'
            example:
              id: evt_b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7
              type: contract.ended
              created_at: '2026-10-16T04:00:00.000Z'
              data:
                demand_id: 9d08ed88-1234-5678-90ab-cdef12345678
                term_end_date: '2026-10-15'
                renewal_type: FIXED_TERM
                notice_deadline: null
                term_state: ENDED
                due_key: ended:2026-10-15
      responses:
        '200':
          description: Webhook alındı
  contract.advanced:
    post:
      tags:
        - Webhooks
      summary: Takip edilen bitiş ileri alındı
      description: |
        Otomatik yenilenen (`renewal_type: AUTO_RENEW`) bir sözleşmenin
        takip edilen bitiş tarihi, günlük olarak bir sonraki döneme
        ileri alındığında tetiklenir.

        **Platform takip kaydıdır; sözleşmenin hukuken yenilendiğini veya
        sona erdiğini belirtmez.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - contract.advanced
                    data:
                      $ref: '#/components/schemas/WebhookDataContractTerm'
            example:
              id: evt_c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8
              type: contract.advanced
              created_at: '2026-10-16T04:00:00.000Z'
              data:
                demand_id: 9d08ed88-1234-5678-90ab-cdef12345678
                term_end_date: '2027-04-15'
                renewal_type: AUTO_RENEW
                notice_deadline: '2027-03-31'
                term_state: ACTIVE
                due_key: advance:2027-04-15
      responses:
        '200':
          description: Webhook alındı
components:
  parameters:
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: |
        Organizasyon (workspace) kimliği.

        - **Organizasyon anahtarı:** zorunlu değildir; gönderilmezse anahtarın
          bağlı olduğu organizasyon otomatik uygulanır. Anahtarın
          organizasyonundan farklı bir kimlik gönderilirse 403
          `WORKSPACE_MISMATCH` döner.
        - **Kişisel anahtar:** gerekmez. Üyesi olmadığınız bir organizasyon
          kimliği gönderilirse 403 döner
          (`Not a member of this organization`).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: |
        Çağıranın kendi referansı (sipariş / dosya numarası olabilir). Aynı API
        anahtarı + aynı anahtarla gelen İKİNCİ istek yeni sözleşme YARATMAZ:
        ilk sözleşme `reused: true` + `created_at` ile döner, kredi düşülmez,
        davet gönderilmez.

        🔴 Anahtar KALICIDIR (süre sınırı yoktur). Numaralandırmanızı yıl
        döngüsünde tekrar kullanıyorsanız yıl/ön ek ekleyin. Aynı anahtar
        FARKLI içerikle gelirse `409 IDEMPOTENCY_KEY_REUSED` döner.

        Tekrar yanıtı ilk yanıtın birebir kopyası DEĞİLDİR: yalnız kalıcı
        alanlar (kimlik, durum, sayfalar, imza bağlantıları) döner;
        `dispatch`, `variables_applied`, `field_layout` gibi o isteğin çalışma
        zamanı çıktıları YOKTUR. Anahtara kişisel veri yazmayın (alan düz metin
        saklanır).

        Multipart uçlarda başlık yerine gövdedeki `idempotency_key` alanı da
        kullanılabilir; ikisi birden gönderilip ÇELİŞİRSE
        `400 INVALID_IDEMPOTENCY_KEY`.

        Biçim: 1-255 karakter, boşluksuz yazdırılabilir ASCII.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Format: imz_<64-hex-chars>'
  schemas:
    TemplateSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        usage_count:
          type: integer
        parties:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              order:
                type: integer
              label:
                type: string
              is_required:
                type: boolean
    TemplateDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        usage_count:
          type: integer
        parties:
          type: array
          items:
            $ref: '#/components/schemas/TemplatePartySummary'
        pages_count:
          type: integer
        variables:
          type: array
          items:
            $ref: '#/components/schemas/TemplateVariable'
        documents:
          type: array
          description: Şablonun zarf belgeleri (order artan). Belge yapısı henüz hazır değilse boş dizi.
          items:
            $ref: '#/components/schemas/TemplateDocumentSummary'
    TemplatePartySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order:
          type: integer
        label:
          type: string
          example: Musteri
        is_required:
          type: boolean
        default_locale:
          $ref: '#/components/schemas/SignerLocale'
          description: Bu şablondan oluşturulan sözleşmede tarafa varsayılan olarak atanan imzacı dili.
    TemplateDocumentSummary:
      type: object
      description: |
        Şablonun zarf belgesi. `id` alanı `POST /api/v1/demands` ve
        `POST /api/v1/demands/bulk` isteklerindeki `documents.include` /
        `documents.exclude` listelerinde kullanılır. Şablon kopyalandığında
        (panelden "Kopyala" ya da sözleşmeden şablon oluşturma) kopyanın belge
        kimlikleri YENİDİR; entegrasyonunuz kopyanın kimliklerini bu uçtan
        yeniden okumalıdır. Başlık, tür ve ayar değişiklikleri ile yeniden
        sıralama kimliği değiştirmez.
      properties:
        id:
          type: string
          format: uuid
        order:
          type: integer
          description: Şablondaki sıra (1'den başlar)
        title:
          type: string
        doc_kind:
          type: string
          enum:
            - CONTRACT
            - KVKK_NOTICE
            - KVKK_CONSENT
            - PREINFO
            - PRICE_LIST
            - OTHER
        is_required:
          type: boolean
          description: |
            İmzacının bu belgeyi atlayıp atlayamayacağı. Gönderilecek belgeleri
            SEÇMEKLE ilgisi yoktur: zorunlu belge de `documents.exclude` ile
            bu imza sürecinden çıkarılabilir. Mevzuat gereği karşı tarafa
            verilmesi gereken bir belgeyi (örneğin `doc_kind: PREINFO` ön
            bilgilendirme formu veya `KVKK_NOTICE` aydınlatma metni) başka bir
            kanaldan vermiyorsanız çıkarmayın; bu belgelerin verilmesi
            yükümlülüğü sözleşmeyi gönderene aittir.
        signature_required:
          type: boolean
        default_included:
          type: boolean
          description: İstek `documents` belirtmezse bu belge imza sürecine (zarfa) dahil edilir mi.
        assigned_template_party_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Bu belgeyi imzalayacak şablon rollerinin kimlikleri (`parties[].id`
            ve `party_mapping[].template_party_id` ile aynı küme). Sözleşme
            uçlarındaki `assigned_party_ids` (imzacı kimliği) ile karıştırmayın.
    DocumentSelectionInput:
      type: object
      additionalProperties: false
      description: |
        Bu istekte gönderilecek belgeleri şablon varsayılanına göre değiştirir.
        Alan hiç gönderilmezse `default_included: true` olan belgeler gider.
        `include` varsayılanı kapalı belgeyi ekler, `exclude` varsayılanı açık
        belgeyi (zorunlu olsa bile) çıkarır. Çıkarılan belge bu imza sürecine
        (zarfa) eklenmez: imzacıya gösterilmez, imzalı PDF'te ve tamamlanma
        sertifikasında yer almaz, kredi hesaplamasına dahil edilmez. Sonuçta
        en az bir belge kalmalıdır ve eşlediğiniz her role en az bir seçili
        belge düşmelidir. Mevzuat gereği verilmesi gereken belgeleri
        çıkarmadan önce `is_required` açıklamasına bakın; bu belgelerin
        verilmesi yükümlülüğü sözleşmeyi gönderene aittir.
      properties:
        include:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
          description: Şablon belge kimlikleri (`GET /api/v1/templates/{id}` → `documents[].id`).
        exclude:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
    DocumentSelectionError:
      type: object
      description: |
        `400 INVALID_DOCUMENT_SELECTION` gövdesi. `details.reason` hatanın
        sınıfını, `details.document_ids` (varsa) yalnız isteğinizde
        gönderdiğiniz ve soruna yol açan kimlikleri taşır.
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string
          enum:
            - INVALID_DOCUMENT_SELECTION
        details:
          type: object
          properties:
            reason:
              type: string
              enum:
                - shape
                - unknown_document
                - conflict
                - empty
              description: |
                `shape`: `documents` nesne değil, bilinmeyen alan, kimlikler
                metin değil, listede 20'den fazla kimlik ya da toplu uçta
                `options.documents`. `unknown_document`: kimlik bu şablonun
                belgesi değil. `conflict`: aynı kimlik hem `include` hem
                `exclude` listesinde. `empty`: seçim sonucunda ya da
                `documents` göndermediyseniz şablonun varsayılan belge
                kümesinde gönderilecek belge kalmadı.
            document_ids:
              type: array
              items:
                type: string
    TemplateVariable:
      type: object
      properties:
        slug:
          type: string
          example: adres
        label:
          type: string
          example: ADRES
        item_type:
          type: string
          enum:
            - dynamic_text
            - cells
            - date
            - dropdown
            - text
        is_required:
          type: boolean
        default_source:
          type: string
          nullable: true
          example: '{{signer.full_name}}'
          description: |
            Doluysa item değeri otomatik olarak bu kaynaktan dolar
            (örn. signer.full_name → party_mapping'teki ad+soyad).
            variables payload'ında override edilebilir.

            **Kullanılabilir sistem değişkenleri:**

            İmzalayan (party-bağlı, render anında çözülür):
            - `signer.first_name`, `signer.last_name`, `signer.full_name`
            - `signer.email`, `signer.phone`, `signer.government_id`
            - `signer.birth_date` — İmzalayanın doğum tarihi (gg.aa.yyyy).
              Source: `party_mapping[i].birth_date` API alanı.
            - `signer.sign_date` — İmzalayanın imza tarihi (gg.aa.yyyy);
              imzalanmadıysa boş. Source: server-computed
              (`DemandContractParty.sign_timestamp`), API üzerinden
              settable DEĞİL.

            Sözleşme: `contract.title`, `contract.created_date`,
            `contract.expiry_date`, `contract.id`

            Gönderen: `sender.full_name`, `sender.email`, `sender.company_name`

            Tarih: `current.date`, `current.datetime`

            **Precedence — TC alanı ve diğer slug çakışmaları:**
            Eğer `party_mapping[i].government_id` ile
            `party_mapping[i].variables.tc_kimlik` (veya başka slug-eşleşmeli
            variable) aynı anda gönderilirse, **`variables.<slug>` öncelikli**
            olur. Bunun nedeni `applyPartyAwareVariables` slug yazımını önce
            uygular; system variable autofill (`signer.government_id`
            defaultSource'u) sonra çalışır ve dolu alanları atlar.
        template_party_id:
          type: string
          nullable: true
          description: |
            Bu field'in sahibi olan template parti id'si.
            NULL ise root scope (party_mapping dışında) — kök variables'a
            göndermeniz gerekir. Doluysa party_mapping[i].variables'ta i
            bu id ile eşleşen partinin altına göndermeniz gerekir.
    TemplateUsage:
      type: object
      properties:
        kind:
          type: string
          enum:
            - DOCUMENT
            - FIELD_LAYOUT
          description: |
            Rehberin anlattığı akış. Bu uç yalnız belgeli şablonu çözer,
            dolayısıyla burada daima `DOCUMENT` döner (Alan Şablonu bu uçta
            404'tür; kimliği `GET /api/v1/field-templates` ile öğrenilir ve
            `POST /api/v1/demands/upload` ile kullanılır).
        form_fields:
          type: array
          description: |
            `multipart/form-data` alanları. Belgeli şablon JSON gövde
            kullandığı için bu uçta boş dizidir.
          items:
            type: object
            properties:
              key:
                type: string
              type:
                type: string
              required:
                type: boolean
              note:
                type: string
        template:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            description:
              type: string
              nullable: true
            category:
              type: string
              nullable: true
        endpoint:
          type: object
          properties:
            method:
              type: string
              example: POST
            url:
              type: string
              example: https://api-prd.imzala.org/api/v1/demands
        required_headers:
          type: object
          additionalProperties:
            type: string
          example:
            X-API-Key: <sizin API anahtariniz>
            X-Workspace-Id: ed422ff9-...
            Content-Type: application/json
        parties:
          type: array
          items:
            type: object
            properties:
              template_party_id:
                type: string
                format: uuid
              order:
                type: integer
              label:
                type: string
              is_required:
                type: boolean
              field_count:
                type: integer
                description: |
                  Rolün doldurduğu alan sayısı. Yalnız Alan Şablonu
                  rehberinde döner, bu uçta bulunmaz.
              supported_fields:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    type:
                      type: string
                    required:
                      type: boolean
                    required_if:
                      type: string
                    default: {}
        variables:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              label:
                type: string
              item_type:
                type: string
              is_required:
                type: boolean
              default_source:
                type: string
                nullable: true
              auto_filled:
                type: boolean
              template_party_id:
                type: string
                nullable: true
              template_document_id:
                type: string
                nullable: true
                description: |
                  Alanın bulunduğu şablon belgesi (`document_variables`
                  anahtarı). Aynı slug birden fazla belgede geçiyorsa belge
                  başına ayrı satır döner.
              note:
                type: string
        documents:
          type: array
          description: |
            Şablonun belgeleri (sıra artan). `document_variables`
            anahtarları buradaki `template_document_id` değerleridir.
          items:
            type: object
            properties:
              template_document_id:
                type: string
              title:
                type: string
              order:
                type: integer
              default_included:
                type: boolean
                description: '`documents` seçimi gönderilmezse bu belge sözleşmeye girer mi.'
        example_request:
          type: object
          properties:
            curl:
              type: string
              description: curl komutu, slug'lar dolu
            json:
              type: object
              description: >-
                JSON payload, multi-party ve belge farkında (party_mapping[].variables + root
                variables; aynı slug birden fazla belgede geçiyorsa document_variables ile belge
                başına farklı değer)
    SignerLocale:
      type:
        - string
        - 'null'
      enum:
        - tr
        - en
        - null
      description: İmzacı dili. `tr` (Türkçe), `en` (İngilizce) veya `null` (atanmadı).
      example: en
    PartyMappingInput:
      type: object
      required:
        - template_party_id
        - first_name
        - last_name
      properties:
        template_party_id:
          type: string
          format: uuid
          description: GET /api/v1/templates/{id} cevabındaki parties[].id
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
          description: email VEYA phone'dan en az biri zorunlu
        phone:
          type: string
          description: E.164 format (örn. "+905551112233")
        government_id:
          type: string
          description: TC kimlik no (11 hane)
        birth_date:
          type: string
          format: date
          description: ISO 8601 (örn. "1990-05-15")
        send_sms:
          type: boolean
          default: true
        send_email:
          type: boolean
          default: true
        locale:
          $ref: '#/components/schemas/SignerLocale'
          description: >-
            İmza sayfasının başlangıç dili (`tr` veya `en`); imzacı sayfada değiştirebilir.
            Gönderilmezse şablon rolünün varsayılan dili (`default_locale`), o da yoksa tarayıcı
            dili İngilizce ise İngilizce, aksi halde Türkçe kullanılır. `null` gönderilirse şablon
            varsayılanı uygulanmaz, dil tarayıcıya göre belirlenir. Bildirimler (e-posta, SMS)
            tarafa atanan dilde gider; dil atanmamışsa Türkçe gider. WhatsApp'ta İngilizce için
            kurumunuzun onaylı İngilizce şablonu gerekir. Geçersiz değer `400 INVALID_LOCALE` döner.
          example: en
        variables:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: 'null'
              - $ref: '#/components/schemas/StampData'
          description: |
            Bu PARTİYE AİT dynamic field'lara gönderilen değerler. Slug bazında
            eşleşir. Item'ın template_party_id'si bu partiyle aynı olmalı; değilse
            değişken atlanır ve variables_ignored'a düşürülür. Kaşe alanının
            slug'ına `StampData` nesnesi verilebilir (bkz.
            `CreateDemandRequest.variables`).
        document_variables:
          allOf:
            - $ref: '#/components/schemas/DocumentVariables'
          description: |
            Bu partinin BELGE BAŞINA değerleri. Anahtar şablon belgesinin
            kimliğidir (`GET /api/v1/templates/{id}/usage` cevabındaki
            `documents[].template_document_id`); belge başlığı ya da sırası
            anahtar olarak kullanılamaz. Aynı slug için en yüksek önceliklidir
            (bkz. `CreateDemandRequest.document_variables`).
    DocumentVariables:
      type: object
      maxProperties: 20
      description: |
        Belge kimliği → (slug → değer). Değerler string, number, boolean ya
        da null olabilir; kaşe alanının slug'ına `StampData` nesnesi de
        verilebilir (kaşe o belgede olmalı). Belge kimliği bu şablonun, bu
        istekte gönderilen (`documents` seçimi sonrası) bir belgesi olmalıdır.
      additionalProperties:
        type: object
        additionalProperties:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
            - $ref: '#/components/schemas/StampData'
    ContractTerm:
      type: object
      required:
        - start_mode
        - start_date
        - duration_months
        - fixed_end_date
        - end_date
        - end_date_signed
        - renewal_type
        - renewal_period_months
        - notice_days
        - notice_deadline
        - reminder_offsets
        - notify_counterparty
        - state
        - days_left
        - renewal_stopped_at
      description: |
        Sözleşme süre/yenileme takibi. Sözleşmede takip hiç tanımlanmadıysa
        (`start_mode` VE `end_date` boşsa) bu alan `null` döner.

        Bu, hukuki bir yenileme veya sona erme beyanı değildir; platformun
        takip amaçlı kaydıdır. Sözleşmenin fiilen ne zaman sona erdiği veya
        yenilendiği, tarafların kendi sözleşme hükümlerine ve yürürlükteki
        hukuka tabidir. Bu alan yalnız hatırlatma ve görünürlük sağlar.
      properties:
        start_mode:
          type: string
          nullable: true
          enum:
            - FIXED_DATE
            - ON_FIRST_SIGNATURE
            - ON_COMPLETION
          description: |
            Takibin ne zaman başladığı. `FIXED_DATE`: `start_date`'ten.
            `ON_FIRST_SIGNATURE` / `ON_COMPLETION`: ilk imza / tüm imzalar
            tamamlandığı anda otomatik (o ana kadar `end_date` bilinmez).
        start_date:
          type: string
          format: date
          nullable: true
        duration_months:
          type: integer
          nullable: true
          minimum: 1
          maximum: 600
        fixed_end_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
          description: |
            Takip edilen bitiş tarihi. `renewal_type: AUTO_RENEW` sözleşmelerde
            her dönemde (günlük olarak) bir sonraki döneme ileri alınır;
            bkz. `contract.advanced` webhook olayı.
        end_date_signed:
          type: string
          format: date
          nullable: true
          description: |
            İmzalanan belge metninde bitiş tarihi bir değişken olarak
            yazılıysa, sözleşme tamamlandığı anda `end_date`'in dondurulmuş
            kopyası. `end_date` sonradan ileri alınsa bile bu alan DEĞİŞMEZ.
            İmzalanan metinle takip değeri arasındaki tarihsel referans budur.
        renewal_type:
          type: string
          nullable: true
          enum:
            - AUTO_RENEW
            - FIXED_TERM
        renewal_period_months:
          type: integer
          nullable: true
          minimum: 1
          maximum: 600
        notice_days:
          type: integer
          nullable: true
          minimum: 0
          maximum: 3650
          description: Fesih ihbarı için bitişten önce kaç gün gerektiği.
        notice_deadline:
          type: string
          format: date
          nullable: true
          description: Hesaplanır (`end_date - notice_days`); `end_date` veya `notice_days` boşsa `null`.
        reminder_offsets:
          type: array
          nullable: true
          maxItems: 5
          items:
            type: integer
            minimum: 0
            maximum: 3650
          description: Bitişten kaç gün önce hatırlatma gönderileceği (gün sayıları).
        notify_counterparty:
          type: boolean
          description: Karşı tarafa da hatırlatma gönderilsin mi.
        state:
          type: string
          enum:
            - UNTRACKED
            - ACTIVE
            - ENDED
            - STOPPED
          description: |
            `UNTRACKED`: takip yok (`end_date` bilinmiyor). `ACTIVE`: takip
            sürüyor. `ENDED`: `FIXED_TERM` sözleşmenin bitiş tarihi geçti.
            `STOPPED`: yenileme takibi kullanıcı tarafından durduruldu.
        days_left:
          type: integer
          nullable: true
          description: Bugünden `end_date`'e gün sayısı (negatifse geçmişte).
        renewal_stopped_at:
          type: string
          format: date-time
          nullable: true
    ContractTermInput:
      type: object
      description: |
        Sözleşme süre/yenileme takibi girdisi. `POST /demands` üzerinde
        oluştururken ve `PATCH /demands/{id}/term` üzerinde güncellerken AYNI
        alan adları kullanılır. `PATCH`'te kısmi güncelleme uygulanır: yalnız
        gövdede GÖNDERİLEN anahtarlar değiştirilir; bir anahtarı `null`
        göndermek o alanı temizler, hiç göndermemek dokunmaz.

        Doğrulama kuralları:
        - `term_fixed_end_date` ile `term_duration_months` birlikte gönderilemez.
        - `term_start_mode: FIXED_DATE` ise oluştururken `term_start_date` ya
          da `term_fixed_end_date` gerekir; `ON_FIRST_SIGNATURE` /
          `ON_COMPLETION` modlarında `term_start_date` gönderilse de yok
          sayılır (başlangıç imza anında otomatik yazılır).
        - `renewal_type: AUTO_RENEW` ise `renewal_period_months` gerekir;
          gönderilmezse `term_duration_months`'tan devralınır.
        - Geçersiz kombinasyon 400 `TERM_INVALID` + hangi alanı işaret eden
          `field` ile döner.
      properties:
        term_start_mode:
          type: string
          nullable: true
          enum:
            - FIXED_DATE
            - ON_FIRST_SIGNATURE
            - ON_COMPLETION
        term_start_date:
          type: string
          format: date
          nullable: true
          description: 'Yalnız `term_start_mode: FIXED_DATE` iken kullanılır.'
        term_duration_months:
          type: integer
          nullable: true
          minimum: 1
          maximum: 600
        term_fixed_end_date:
          type: string
          format: date
          nullable: true
        renewal_type:
          type: string
          nullable: true
          enum:
            - AUTO_RENEW
            - FIXED_TERM
        renewal_period_months:
          type: integer
          nullable: true
          minimum: 1
          maximum: 600
        notice_days:
          type: integer
          nullable: true
          minimum: 0
          maximum: 3650
        reminder_offsets:
          type: array
          nullable: true
          maxItems: 5
          items:
            type: integer
            minimum: 0
            maximum: 3650
          description: |
            Boş dizi göndermek şablon/önceki değeri SİLMEZ (yok sayılır);
            temizlemek için `null` gönderin.
        notify_counterparty:
          type: boolean
          default: false
    CreateDemandRequest:
      type: object
      required:
        - template_id
        - party_mapping
      properties:
        template_id:
          type: string
          format: uuid
          description: GET /api/v1/templates listesinden veya dashboard'dan kopyalayın
        title:
          type: string
          description: |
            Sözleşme başlığı (yoksa template adı kullanılır). Başlık,
            imza davet ve hatırlatma SMS'lerinde imzacının telefon
            ekranında görünebilir; kişisel veya gizli bilgi yazmayın.
        description:
          type: string
        idempotency_key:
          type: string
          maxLength: 255
          description: |
            `Idempotency-Key` başlığının gövde karşılığı; başlık ekleyemeyen
            istemciler için. İkisi birden gönderilip ÇELİŞİRSE
            `400 INVALID_IDEMPOTENCY_KEY`.
        force:
          type: boolean
          description: |
            Kopya kapısını bilerek geç. Yalnız idempotency anahtarı
            GÖNDERİLMEYEN çağrılarda anlamlıdır: aynı şablondan aynı taraflara
            aynı başlık ve değişkenlerle 10 dakika içinde ikinci bir sözleşmeyi
            kasten göndermek için.
        party_mapping:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PartyMappingInput'
        documents:
          $ref: '#/components/schemas/DocumentSelectionInput'
        variables:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: 'null'
              - $ref: '#/components/schemas/StampData'
          description: |
            **Root scope** — partilerden bağımsız field'lara gönderilen değerler.
            Item'ın template_party_id'si NULL ise (partisiz) buradan dolar.
            Multi-party şablonda kira_baslangic_tarihi gibi paylaşılan field'lar.

            **Kaşe alanları:** Değer bir `StampData` NESNESİ ise ve slug bir
            kaşe alanına aitse, sözleşme oluşturulurken o kaşe
            `PATCH /api/v1/demands/{id}/items/{itemId}/stamp` ile aynı kurallarla
            doldurulur (gönderenin kaşesi yapılandırılmış veriyle; imzalayanın
            dolduracağı kaşeye düzenlenebilir ön değer). Aynı slug birden fazla
            belgede geçiyorsa hepsine yazılır; öncelik kuralları `variables` ile
            aynıdır (bkz. `document_variables`). Nesne değer yalnız kaşe
            slug'ına verilebilir: kaşe olmayan ya da gönderilecek belgelerde
            bulunmayan slug 400 `INVALID_VARIABLES`
            (`details.reason: object_value_for_non_stamp`), geçersiz kaşe
            verisi 400 `INVALID_STAMP_DATA` döner; ikisinde de sözleşme
            oluşturulmaz, kredi düşülmez. Kaşe slug'ına düz metin gönderilirse
            kaşeye yazılmaz ve `variables_ignored` içinde görünür. Toplu
            uçlar nesne değeri desteklemez (400 `INVALID_VARIABLES`,
            `details.reason: unsupported_endpoint`).
          example:
            kira_baslangic_tarihi: '2026-10-01'
            firma_kasesi:
              companyName: Örnek Ltd.
              taxNumber: '1234567890'
              taxOffice: Kadıköy
              companyAddress: Kadıköy, İstanbul
        document_variables:
          allOf:
            - $ref: '#/components/schemas/DocumentVariables'
          description: |
            Çok belgeli şablonda BELGE BAŞINA ortak değerler (o belgedeki tüm
            taraflar ve partisiz alanlar için). Opsiyoneldir; göndermezseniz
            `variables` ve `party_mapping[].variables` eskisi gibi çalışır.

            Öncelik (alan bazında; bir seviyede anahtar yoksa bir alttakine
            düşer, açıkça gönderilen boş metin ya da null o seviyede kalır):
            1. `party_mapping[i].document_variables[belge][slug]`
            2. `document_variables[belge][slug]`
            3. `party_mapping[i].variables[slug]`
            4. `variables[slug]`

            Şablona ait olmayan ya da bu istekte gönderilmeyen belge kimliği
            400 `INVALID_DOCUMENT_VARIABLES` ile reddedilir; sözleşme
            oluşturulmaz, kredi düşülmez, davet gönderilmez.
        has_timestamp:
          type: boolean
          default: false
          description: TÜBİTAK zaman damgası
        allowed_signature_variants:
          type: array
          nullable: true
          maxItems: 4
          items:
            type: string
            enum:
              - draw
              - type
              - upload
              - phone
              - phone_draw
          description: |
            İmzacının kullanabileceği dijital imza yöntemleri ve görünme sırası.
            Dizinin SIRASI imza ekranındaki sekme sırasıdır; listede olmayan
            yöntem o sözleşmede kapalıdır. Değerler: `draw` (parmakla veya fareyle
            çizerek), `type` (adını yazarak), `upload` (imza görselini dosya olarak
            yükleyerek), `phone` (telefonda çizerek).

            Gönderilmezse (veya `null` gönderilirse) şablonun ayarı, şablonda da
            tanımlı değilse organizasyonun ayarı geçerli olur; hiçbiri tanımlı
            değilse dört yöntem varsayılan sırayla açıktır.

            Bu alan toleranslı okunur: boş dizi, dizi olmayan bir değer veya
            tanınmayan bir değer gönderilirse alan YOK SAYILIR ve üst katmandan
            devralınır. Yani boş dizi göndermek "tüm yöntemleri kapat" anlamına
            GELMEZ; en az bir yöntem her zaman açık kalır. Büyük harfli değerler
            (`DRAW`) kabul edilir, tekrar eden değerler teke indirilir.

            Yalnız `phone` içeren bir liste reddedilir (400
            `SIGNATURE_VARIANTS_PHONE_ONLY`): telefonda çizim mobil cihazda
            kullanılamadığı için tek başına bırakılırsa imzacı yöntemsiz kalır.
            En az bir `phone` olmayan yöntem bırakın.

            `phone_draw` ("Yalnız telefonda çizerek") ayrı bir moddur ve YALNIZ
            tek başına gönderilir: `["phone_draw"]`. Bilgisayardan açan imzacı
            yalnız QR kod ile telefona yönlendirilir ve imzasını telefonda
            çizer; telefondan açan imzacı yalnız çizerek imzalar. Başka bir
            yöntemle birlikte gönderilirse 400
            `SIGNATURE_VARIANTS_PHONE_DRAW_EXCLUSIVE` döner.

            Ayar sözleşme düzeyindedir; imzacı bazında farklılaştırılamaz.
            `party_mapping` girdilerine yazılan böyle bir alan yok sayılır.
          example:
            - type
            - draw
        dispatch_notifications:
          type: boolean
          default: true
          description: |
            `false` verilirse sözleşme yalnız oluşturulur, davet gönderilmez;
            daha sonra `POST /api/v1/demands/{demandId}/dispatch` ile gönderilir
            (çok-belgeli zarf akışında belgeler bu arada eklenir). Varsayılan
            açık: davetler oluşturma anında gider.
        send_sms_notifications:
          type: boolean
          default: true
        send_email_notifications:
          type: boolean
          default: true
        sms_title:
          type: string
          default: CODECK
          description: SMS gönderici adı
        sms_content:
          type: string
          description: |
            Custom SMS gövdesi. **Sadece** çağıran organizasyon **PRO veya ENTERPRISE planda**
            ise ve aktif `OrganizationSmsConfig` (sender_name dolu) varsa kabul edilir;
            aksi halde 403 `SMS_CUSTOMIZATION_NOT_ALLOWED` döner.

            FREE/BASIC planda olan veya kendi SMS sağlayıcısı tanımlı olmayan
            müşterilerin marka itibarını korumak için sistem default sağlayıcısı (Codeck NetGSM)
            ile gönderim yapılır ve özel metin reddedilir. Kendi sağlayıcınızı tanımlamak için
            Dashboard → Organizasyon → SMS Ayarları sayfasını kullanın.

            Boş string / null gönderirseniz "clear" olarak yorumlanır (gating'den geçer).
        email_content:
          type: string
          description: Custom e-posta gövdesi
        expiry_date:
          type: string
          format: date-time
        require_tc_verification:
          type: boolean
          default: false
        require_biometric_verification:
          type: boolean
          default: false
        reminder_settings:
          allOf:
            - $ref: '#/components/schemas/ReminderSettings'
          description: >
            Bu sözleşme için hatırlatma ayarlarını **şablon default'unu override** ederek

            belirtir. Yollanmazsa şablonun `reminder_*` alanları kullanılır

            (PUT /api/templates/:id ile dashboard'dan kaydedilen değerler);

            şablonda da yoksa `{enabled:true, intervals_hours:[48], max_reminders:1,
            channels:["email"]}`

            default'u uygulanır. Demand oluşumunda `ReminderConfig` satırı yaratılır

            ve BullMQ kuyruğuna scheduled hatırlatmalar yazılır.
        term_start_mode:
          type: string
          nullable: true
          enum:
            - FIXED_DATE
            - ON_FIRST_SIGNATURE
            - ON_COMPLETION
          description: |
            Sözleşme süre/yenileme takibi. Gönderilmezse şablonun takip
            politikası kullanılır. Tam alan kümesi ve doğrulama kuralları
            için `ContractTermInput` şemasına bakın (`PATCH /demands/{id}/term`
            ile AYNI alan adları).
        term_start_date:
          type: string
          format: date
          nullable: true
          description: 'Yalnız term_start_mode: FIXED_DATE iken kullanılır.'
        term_duration_months:
          type: integer
          nullable: true
          minimum: 1
          maximum: 600
        term_fixed_end_date:
          type: string
          format: date
          nullable: true
        renewal_type:
          type: string
          nullable: true
          enum:
            - AUTO_RENEW
            - FIXED_TERM
        renewal_period_months:
          type: integer
          nullable: true
          minimum: 1
          maximum: 600
          description: AUTO_RENEW gerektirir; verilmezse term_duration_months'tan devralınır.
        notice_days:
          type: integer
          nullable: true
          minimum: 0
          maximum: 3650
        reminder_offsets:
          type: array
          nullable: true
          maxItems: 5
          items:
            type: integer
            minimum: 0
            maximum: 3650
        notify_counterparty:
          type: boolean
          default: false
    ReminderSettings:
      type: object
      description: |
        Hatırlatma yapılandırması. Şablon (`Template.reminder_*`) ve sözleşme
        (`ReminderConfig`) arasında aynı şemaya sahiptir.
      properties:
        enabled:
          type: boolean
          default: true
          description: false → hiç hatırlatma gönderilmez (cron schedule edilmez)
        intervals_hours:
          type: array
          items:
            type: integer
            minimum: 1
          default:
            - 48
          description: |
            Sözleşmenin oluşturulduğu andan itibaren saat cinsinden hatırlatma
            aralıkları. Örn. `[24, 72, 168]` → 24 saat sonra, 3 gün sonra ve
            7 gün sonra. `max_reminders` ile limit edilir.
          example:
            - 24
            - 72
        max_reminders:
          type: integer
          minimum: 0
          default: 1
          description: Bir parti için maksimum gönderilecek hatırlatma sayısı
          example: 2
        channels:
          type: array
          items:
            type: string
            enum:
              - email
              - sms
          default:
            - email
          description: |
            Hatırlatma gönderim kanalı. Birden fazla seçilebilir
            (`["email","sms"]`). SMS kanalı için partinin `phone` alanı dolu ve
            `send_sms: true` olmalı; email kanalı için `email` dolu ve
            `send_email: true` olmalı, ayrıca demand'in `send_sms_notifications`
            / `send_email_notifications` global toggle'ı açık olmalı.
          example:
            - email
            - sms
    TriggerReminderRequest:
      type: object
      description: Anlık hatırlatma tetikleme isteği gövdesi (tüm alanlar opsiyonel).
      properties:
        channels:
          type: array
          items:
            type: string
            enum:
              - email
              - sms
          default:
            - sms
            - email
          description: |
            Bu çağrıda kullanılacak kanal(lar). Yollanmazsa default `["sms","email"]`
            ile her iki kanalda da gönderilir (parti `send_sms`/`send_email`
            toggle'ı + iletişim alanı + demand global toggle uygunluğuna göre).
          example:
            - sms
        force:
          type: boolean
          default: false
          description: |
            `true` ise 5 dk anti-spam penceresini override eder (son hatırlatma
            5 dk içinde gönderilmiş olsa bile gönderir). Production akışlarında
            yanlışlıkla spam atmamak için sadece kasıtlı admin operasyonlarında
            kullanın.
    CreatedDemand:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          example: PENDING
          enum:
            - DRAFT
            - PENDING
        template_id:
          type: string
          format: uuid
        signing_urls:
          type: array
          items:
            type: object
            properties:
              party_id:
                type: string
                format: uuid
              first_name:
                type: string
              last_name:
                type: string
              email:
                type: string
                nullable: true
              phone:
                type: string
                nullable: true
              signing_url:
                type: string
                format: uri
                example: https://e.imzala.org/imza/<party_id>
        result_url:
          type: string
          format: uri
          example: https://e.imzala.org/sonuc/<demand_id>
        variables_applied:
          type: array
          items:
            type: string
          description: |
            Uygulanan TÜM slug'ların unique union'ı (sorted). Geriye dönük
            uyumluluk için korunur — yeni entegrasyonlar
            variables_applied_root + variables_applied_by_party kullanmalı.
          example:
            - address
            - iban
            - kira_bedeli
        variables_applied_root:
          type: array
          items:
            type: string
          description: Root variables'tan uygulanan slug listesi (sorted).
          example:
            - kira_bedeli
        variables_applied_by_party:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: |
            template_party_id → o partiye uygulanan slug listesi (sorted per party).
          example:
            <kiraya-veren-id>:
              - address
              - iban
            <kiraci-id>:
              - address
              - iban
        variables_ignored:
          type: array
          items:
            type: string
          description: |
            Gönderdiğiniz AMA hiçbir item'a uygulanmayan slug'lar (unique, sorted).
            Boş olmayınca yazım hatası yapmışsınız demektir — kontrol edin.
          example: []
        stamps_applied:
          type: array
          description: |
            Yalnız kaşe slug'ına `StampData` nesnesi gönderildiyse döner.
            Nesne değerle doldurulan kaşe alanları (alan kimliği sözleşmeye
            aittir, şablona değil).
          items:
            type: object
            properties:
              item_id:
                type: integer
              slug:
                type: string
              document_id:
                type: string
                nullable: true
                description: Kaşenin bulunduğu sözleşme belgesi (tek belgeli eski sözleşmede null olabilir).
          example:
            - item_id: 101
              slug: firma_kasesi
              document_id: 3f6c1a2e-8b4d-4e7a-9c11-2d5e8f0a7b33
        variables_applied_by_document:
          type: object
          description: |
            Yalnız `document_variables` gönderildiyse döner. Belge kimliği →
            belge kapsamından uygulanan slug'lar: `_common` (kök
            `document_variables`) ve `_by_party` (template_party_id → slug'lar).
          additionalProperties:
            $ref: '#/components/schemas/DocumentScopedSlugs'
        variables_ignored_by_document:
          type: object
          description: |
            Yalnız `document_variables` gönderildiyse döner. Belge kapsamında
            gönderilip O BELGEDE hiçbir alana yazılmayan slug'lar (aynı biçim).
          additionalProperties:
            $ref: '#/components/schemas/DocumentScopedSlugs'
    DocumentScopedSlugs:
      type: object
      properties:
        _common:
          type: array
          items:
            type: string
        _by_party:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    CreatedDemandUpload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          example: PENDING
        pages:
          type: array
          description: |
            Oluşturulan sözleşmedeki her sayfanın `id` ve `order` bilgisi.
            `POST /api/v1/demands/{id}/items` endpoint'ine alan yerleştirmek
            için `page_id` parametresi olarak kullanın.
          items:
            $ref: '#/components/schemas/DemandPage'
        signing_urls:
          type: array
          items:
            type: object
            properties:
              party_id:
                type: string
                format: uuid
              first_name:
                type: string
              last_name:
                type: string
              email:
                type: string
                nullable: true
              phone:
                type: string
                nullable: true
              signing_url:
                type: string
                format: uri
        result_url:
          type: string
          format: uri
        dispatch:
          description: |
            YALNIZ istekte `send_invitations` gönderildiğinde döner. Davet
            gönderimi 201'i düşürmez (sözleşme yaratılmış ve kredi düşülmüştür),
            bu yüzden hatalar burada taraf bazında raporlanır.
          type: object
          properties:
            requested:
              type: boolean
              example: true
            sent:
              type: integer
              description: |
                En az bir kanaldan (SMS/e-posta/WhatsApp) davet **gönderilen
                taraf** sayısı — kanal sayısı DEĞİL. (`POST /api/v1/demands`
                yanıtındaki `dispatched` alanı kanal sayar; bu alan saymaz.)
            results:
              type: array
              items:
                type: object
                properties:
                  party_id:
                    type: string
                    format: uuid
                  sms:
                    type: boolean
                  email:
                    type: boolean
                  whatsapp:
                    type: boolean
                  error:
                    type: string
                    enum:
                      - DISPATCH_FAILED
                    description: Yalnız o taraf için gönderim patladığında döner.
            error:
              type: string
              enum:
                - DISPATCH_SKIPPED
                - DISPATCH_TOO_MANY
              description: |
                `DISPATCH_SKIPPED` — sözleşme satırı okunamadı, bildirim
                ayarları bilinmediği için hiç davet gönderilmedi.
                `DISPATCH_TOO_MANY` — taraf sayısı 20 sınırını aşıyor.
        field_layout:
          description: |
            YALNIZ `field_template_id` gönderildiğinde döner. Alan yerleşiminin
            uygulanma özeti.
          type: object
          properties:
            template_id:
              type: string
              format: uuid
            applied_fields:
              type: integer
              description: Sözleşmeye yazılan alan sayısı.
            on_anchor_miss:
              type: string
              enum:
                - block
                - drop
              description: |
                İstenen değil, **uygulanan** davranış. `drop` istenip
                uygulanamadıysa burada `block` görürsünüz ve `warnings`
                içinde `ON_ANCHOR_MISS_NOT_RELAXED` bulunur.
            warnings:
              type: array
              items:
                $ref: '#/components/schemas/FieldLayoutWarning'
            diagnostics:
              type: array
              description: |
                Yalnız `WARNING` seviyesindeki tanılar. `ERROR` seviyesinde bir
                tanı olsaydı istek 422 ile reddedilir ve sözleşme yaratılmazdı.
              items:
                $ref: '#/components/schemas/FieldLayoutDiagnostic'
    FieldLayoutWarning:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: ON_ANCHOR_MISS_NOT_RELAXED
        message:
          type: string
    FieldLayoutDiagnostic:
      type: object
      description: |
        Alan yerleşimi tanısı. `code` makine sözleşmesidir, `message` insan
        metnidir (TR). **Bilinmeyen `code` toleranslı okunmalıdır**: yeni kod
        eklemek kırıcı değişiklik sayılmaz, istemci tanımadığı kodda `message`
        alanına düşmelidir.

        Belgenizden çıkarılan hiçbir metin (çapa metni, eşleşen satır, sayfa
        metni, dosya adı) bu yapıya girmez.
      required:
        - code
        - severity
        - item_id
        - item_type
        - message
      properties:
        code:
          type: string
          example: ANCHOR_TEXT_NOT_FOUND
        severity:
          type: string
          enum:
            - ERROR
            - WARNING
        item_id:
          type: integer
          description: |
            Şablon alanının kimliği. `-1` belge/taraf düzeyindeki tanılar için
            kullanılan sentinel değerdir.
        slug:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        item_type:
          type: string
          example: signature
        page:
          type: integer
          nullable: true
          description: 1 tabanlı sayfa numarası; bilinmiyorsa null.
        message:
          type: string
        detail:
          type: object
          nullable: true
          description: |
            Koda göre değişen, kapalı bir anahtar kümesi (yalnız sayısal
            değerler ve alan kimlikleri).
          additionalProperties: true
    FieldLayoutUnresolved:
      type: object
      description: |
        `field_template_id` ile gönderilen bir istekte alan yerleşimi
        çözülemediğinde dönen gövde. **Sözleşme oluşturulmaz, kredi düşülmez.**
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: FIELD_LAYOUT_UNRESOLVED
        message:
          type: string
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/FieldLayoutDiagnostic'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/FieldLayoutWarning'
    FieldTemplateParty:
      type: object
      description: |
        Alan Şablonundaki tek rol. `order`, `POST /api/v1/demands/upload`
        gövdesindeki `parties` dizisinin sırasıdır.
      properties:
        id:
          type: string
          format: uuid
        order:
          type: integer
          example: 1
        label:
          type: string
          nullable: true
          example: Analist
        is_required:
          type: boolean
    FieldTemplateListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        usage_count:
          type: integer
        parties:
          type: array
          items:
            $ref: '#/components/schemas/FieldTemplateParty'
    FieldTemplateDetail:
      type: object
      description: |
        Alan Şablonu ayrıntısı. Alan koordinatları TAŞIMAZ; yerleşimin bir
        belgeye nasıl uygulanacağı için kuru koşum ucunu kullanın.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        total_field_count:
          type: integer
          description: Şablondaki toplam alan sayısı.
        parties:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/FieldTemplateParty'
              - type: object
                properties:
                  field_count:
                    type: integer
                    description: Bu rolün dolduracağı alan sayısı.
    FieldLayoutPreview:
      type: object
      description: Kuru koşum sonucu — hiçbir yan etki üretilmemiştir.
      properties:
        template_id:
          type: string
          format: uuid
        page_count:
          type: integer
          description: Yüklenen belgenin sayfa sayısı.
        resolvable:
          type: boolean
          description: |
            `true` ise aynı belge + aynı şablon ile
            `POST /api/v1/demands/upload` çağrısı alan yerleşimi nedeniyle
            reddedilmez.
        on_anchor_miss:
          type: string
          enum:
            - block
            - drop
          description: Uygulanan davranış (istenen değil).
        placements_summary:
          type: object
          properties:
            total:
              type: integer
            by_item_type:
              type: object
              additionalProperties:
                type: integer
              example:
                signature: 2
                text: 5
            by_page:
              type: array
              items:
                type: object
                properties:
                  page:
                    type: integer
                    description: 1 tabanlı
                  count:
                    type: integer
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/FieldLayoutDiagnostic'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/FieldLayoutWarning'
    DemandPage:
      type: object
      required:
        - id
        - order
      properties:
        id:
          type: integer
          example: 12345
        order:
          type: integer
          example: 1
          description: 1-based sayfa sırası
    PageItem:
      type: object
      required:
        - page_id
        - item_type
        - position_x
        - position_y
        - width
        - height
      description: |
        Sözleşme sayfasına yerleştirilen alan tanımı. Tüm koordinatlar
        sayfa boyutuna göre normalize edilmiş [0,1] aralığında. Origin
        top-left (PDF/canvas standardı).
      properties:
        page_id:
          type: integer
          description: AgreementPage.id (`/upload` response'undaki `pages[].id`)
          example: 12345
        party_id:
          type: string
          format: uuid
          nullable: true
          description: |
            `signature` ve doldurulabilir alanlar (`dynamic_text`,
            `cells`, `date`, `dropdown`, `checkbox`, `radio`) için
            **zorunlu** — alanı dolduracak/imzalayacak partinin id'si
            (`signing_urls[].party_id`). `text` için null. `stamp` için
            yalnız `config.source: FILLER_PROVIDES` ise kaşeyi dolduracak
            taraftır (zorunlu kaşede şart); diğer kaynaklarda yok sayılır.
        item_type:
          type: string
          enum:
            - signature
            - text
            - dynamic_text
            - cells
            - date
            - dropdown
            - checkbox
            - radio
            - stamp
        position_x:
          type: number
          minimum: 0
          maximum: 1
          description: Sayfa genişliğine göre x koordinatı (sol=0)
        position_y:
          type: number
          minimum: 0
          maximum: 1
          description: Sayfa yüksekliğine göre y koordinatı (üst=0)
        width:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        height:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        is_required:
          type: boolean
          default: false
          description: İmza/alan zorunlu mu — tarafın bu alanı doldurmadan imzalayamadığı
        slug:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
          nullable: true
          description: |
            Alan tanımlayıcı (snake_case, 2-50 karakter). Doldurulabilir
            alanlar için **önerilir**. `dynamic_text`/`cells` gibi
            değişken alanlarda `config.defaultSource` ile system
            değişkenleri (`{{signer.full_name}}`, `{{signer.government_id}}`
            vb.) bağlanır.
        label:
          type: string
          nullable: true
          description: Kullanıcıya gösterilecek etiket
        config:
          type: object
          nullable: true
          description: |
            Item type'a özgü konfigürasyon:
            - `dynamic_text`: `{ defaultSource, defaultValue }`
            - `cells`: `{ cellCount, defaultSource }`
            - `date`: `{ defaultSource, defaultValue }`
            - `dropdown`/`radio`: `{ options: [{label, value}], defaultValue }`
            - `checkbox`: `{ checkedByDefault }`
            - `stamp`: `{ source, stampData, isRequired }`: `source` =
              `INLINE` | `FROM_SAVED` | `FILLER_PROVIDES`; `stampData` =
              yapılandırılmış kaşe verisi (bkz. `StampData`)
            - `signature`: `{ requireFirstSignatureOtp: true }` (opsiyonel,
              varsayılan kapalı). Açıksa imzacı, zarftaki İLK imzasını atarken
              tarafın telefon numarasına gönderilen SMS kodunu doğrular;
              girişteki telefon doğrulama adımı bu taraf için gösterilmez.
              Bu taraf için sözleşme içeriği, imza bağlantısına sahip kişi
              tarafından kod girilmeden görüntülenebilir. Sözleşmede telefon
              doğrulaması da açıksa, imza içermeyen kararlar (ör. isteğe
              bağlı bir belgeyi onaylamamak) ayrı bir SMS koduyla
              doğrulanır; bu durumda ilk imzada yeniden kod istenir. Yalnız
              imzacı tarafa atanmış imza alanında ve geçerli cep telefonu
              numarası olan tarafta kullanılabilir. Güvenli elektronik imza,
              onaycı ve kendi kendine imza akışlarında desteklenmez; bu
              durumda gönderim ya da alan kaydı imza bağlantısı
              üretilmeden `400 FIRST_SIGNATURE_OTP_UNSUPPORTED` ile
              reddedilir. Taraf imzalamaya başladıktan sonra açılamaz.
    UpsertItemsRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PageItem'
        page_ids:
          type: array
          items:
            type: integer
          description: |
            **Opsiyonel.** Verilirse sadece bu sayfaların item'ları
            replace edilir; diğer sayfalardaki item'lar korunur.
            Body'deki `items[].page_id` değerleri bu listede olmalıdır.
            Omitted ise tüm sayfaların item'ları replace edilir.
    UpsertItemsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                description: Yaratılan AgreementPageItem snapshot'ı
                properties:
                  id:
                    type: string
                    format: uuid
                  page_id:
                    type: integer
                  party_id:
                    type: string
                    format: uuid
                    nullable: true
                  item_type:
                    type: string
                  position_x:
                    type: number
                  position_y:
                    type: number
                  width:
                    type: number
                  height:
                    type: number
                  is_required:
                    type: boolean
                  slug:
                    type: string
                    nullable: true
                  label:
                    type: string
                    nullable: true
                  config:
                    type: object
                    nullable: true
            items_count:
              type: integer
    DemandStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum:
            - DRAFT
            - PENDING
            - COMPLETED
            - EXPIRED
            - CANCELLED
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        parties:
          type: array
          items:
            type: object
            properties:
              party_id:
                type: string
                format: uuid
              name:
                type: string
                description: Kısaltılmış görünen ad (Ahmet Y.) — KVKK maskeleme
              email_masked:
                type: string
                description: Maskeli e-posta (ay***@example.com)
              signed:
                type: boolean
              signed_at:
                type: string
                format: date-time
                nullable: true
              rejected:
                type: boolean
              rejected_at:
                type: string
                format: date-time
                nullable: true
              signing_url:
                type: string
                format: uri
              locale:
                $ref: '#/components/schemas/SignerLocale'
                description: Tarafa atanan dil (gönderen seçimi veya şablon varsayılanı). `null` = atanmadı.
              signed_locale:
                $ref: '#/components/schemas/SignerLocale'
                description: İmzacının imzaladığı andaki sayfa dili. İmzalanmadıysa `null`.
        stamp_items:
          type: array
          description: |
            Sözleşmedeki kaşe alanları. `PATCH /api/v1/demands/{id}/items/{itemId}/stamp`
            için alan kimliği buradan alınır. Kaşe içeriği bu listede dönmez.
          items:
            type: object
            properties:
              item_id:
                type: integer
                example: 4821
              page_id:
                type: integer
                example: 12345
              document_id:
                type: string
                nullable: true
              slug:
                type: string
                nullable: true
                example: firma_kasesi
              label:
                type: string
                nullable: true
                example: Firma kaşesi
              source:
                type: string
                enum:
                  - INLINE
                  - FROM_SAVED
                  - FILLER_PROVIDES
              party_id:
                type: string
                format: uuid
                nullable: true
                description: Yalnız FILLER_PROVIDES kaşede kaşeyi dolduracak taraf
              is_required:
                type: boolean
        result_url:
          type: string
          format: uri
        pdf_url:
          type: string
          format: uri
          nullable: true
          description: Sadece status=COMPLETED iken dolu
        documents:
          type: array
          description: |
            Zarftaki belgelerin her biri için ayrı durum, `order` sırasıyla.
            Zarf genelindeki `status` alanı değişmez; bu liste hangi belgenin
            ne zaman tamamlandığını, hangisinin beklediğini, mühür durumunu ve
            her tarafın belge başına kararını ayrıca gösterir. Belge kaydı
            bulunmayan eski sözleşmelerde boş dizi döner.
          items:
            $ref: '#/components/schemas/DemandDocumentStatus'
        term:
          allOf:
            - $ref: '#/components/schemas/ContractTerm'
          nullable: true
          description: Sözleşmede süre/yenileme takibi tanımlı değilse `null`.
        archived_at:
          type: string
          format: date-time
          nullable: true
    DemandDocumentStatus:
      type: object
      description: Zarftaki tek bir belgenin durumu.
      properties:
        id:
          type: string
          format: uuid
        order:
          type: integer
          description: 1'den başlar.
        title:
          type: string
        doc_kind:
          type: string
          enum:
            - CONTRACT
            - KVKK_NOTICE
            - KVKK_CONSENT
            - PREINFO
            - PRICE_LIST
            - OTHER
        is_required:
          type: boolean
        signature_required:
          type: boolean
        assigned_party_ids:
          type: array
          items:
            type: string
            format: uuid
        progress:
          $ref: '#/components/schemas/DocumentProgress'
        sealing:
          $ref: '#/components/schemas/DocumentSealing'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/DocumentPartyDecision'
    DocumentProgress:
      type: object
      description: |
        Belgeye atanmış tarafların karar ilerlemesi. Mühürden ve rızadan
        bağımsızdır: `COMPLETED`, belgeye atanmış tüm tarafların bu belge için
        karar verdiğini gösterir (isteğe bağlı bir belgede ret de karardır).
      properties:
        status:
          type: string
          enum:
            - PENDING
            - PARTIAL
            - COMPLETED
          description: |
            `PENDING`: henüz kimse karar vermedi. `PARTIAL`: tarafların bir
            kısmı karar verdi. `COMPLETED`: atanmış tüm taraflar karar verdi.
        active_assigned_party_count:
          type: integer
          description: Belgeye atanmış ve doldurulmuş (boş bırakılmamış) taraf sayısı.
        decided_party_count:
          type: integer
          description: Bunlardan bu belge için karar vermiş olanların sayısı.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Belgenin kendi tamamlanma anı. Sistem bu anı kaydetmediyse `null`
            döner; zarfın tamamlanma zamanı bu alana kopyalanmaz.
    DocumentSealing:
      type: object
      description: Belgenin mühür durumu. Karar ilerlemesinden ayrı bir olgudur.
      properties:
        status:
          type: string
          enum:
            - NONE
            - PENDING
            - SEALED
            - FAILED
        has_timestamp:
          type: boolean
          description: Yalnız `status` `SEALED` iken `true` olabilir.
    DocumentPartyDecision:
      type: object
      description: |
        Bir tarafın bu belge için kararı. Kişisel veri (ad, e-posta, telefon)
        içermez; tarafı `party_id` ile `parties` listesiyle eşleyin.
      properties:
        party_id:
          type: string
          format: uuid
        decision:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - DECLINED
            - WITHDRAWN
          description: |
            Yürürlükteki karar. `PENDING` karar verilmediğini gösterir.
            `WITHDRAWN`, önce verilmiş bir onayın sonradan geri çekildiğini
            gösterir; geri çekme tamamlanmış belgeyi yeniden açmaz.
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Kararın verildiği an. `WITHDRAWN` için geri çekilen onayın anıdır.
            `recorded` `false` iken `null` döner.
        withdrawn_at:
          type: string
          format: date-time
          nullable: true
          description: Yalnız `WITHDRAWN` için dolu; geri çekme anı.
        signature_collected:
          type: boolean
          description: Bu kararla birlikte bu belgede dijital imza toplandı mı.
        recorded:
          type: boolean
          description: |
            `false` ise karar belge bazında kayıtlı değildir; tek belgeli eski
            sözleşmelerde tarafın imzasından türetilmiştir ve karar delili
            olarak kullanılamaz.
        consent_granted:
          type: boolean
          nullable: true
          description: |
            Yalnız `KVKK_CONSENT` belgesinde dolu. Taraf bu belgeyi onaylamış
            ve onayını geri çekmemişse `true`; reddetmiş, geri çekmiş veya
            karar vermemişse `false`. Bu alan yalnızca platformdaki onay
            kaydını yansıtır; açık rızanın KVKK anlamında hukuken geçerli olup
            olmadığını (belirli konuya ilişkin olması, bilgilendirmeye
            dayanması, özgür iradeyle verilmesi) imzala.org değerlendirmez.
            Reddedilen isteğe bağlı bir rıza hizmetin koşulu yapılmamalıdır.
            Diğer belge türlerinde `null`.
    StampData:
      type: object
      additionalProperties: false
      description: |
        Yapılandırılmış kaşe verisi. Tüm alanlar isteğe bağlıdır. PATCH
        isteğinde `null` veya boş string alanı kaldırır.

        Belgeye yalnız gerekli kişisel veriyi yazın; bu verilerin hukuka
        uygunluğu ve aydınlatması sizin sorumluluğunuzdadır.
      properties:
        companyName:
          type:
            - string
            - 'null'
          maxLength: 500
          example: Örnek Ltd.
        personalName:
          type:
            - string
            - 'null'
          maxLength: 500
          example: Ayşe Yılmaz
        address:
          type:
            - string
            - 'null'
          maxLength: 500
        companyAddress:
          type:
            - string
            - 'null'
          maxLength: 500
          example: Kadıköy, İstanbul
        personalAddress:
          type:
            - string
            - 'null'
          maxLength: 500
        taxNumber:
          type:
            - string
            - 'null'
          maxLength: 500
          example: '1234567890'
        taxOffice:
          type:
            - string
            - 'null'
          maxLength: 500
          example: Kadıköy
        idNumber:
          type:
            - string
            - 'null'
          maxLength: 500
        phone:
          type:
            - string
            - 'null'
          maxLength: 500
        companyPhone:
          type:
            - string
            - 'null'
          maxLength: 500
          example: '+905551112233'
        personalPhone:
          type:
            - string
            - 'null'
          maxLength: 500
        email:
          type:
            - string
            - 'null'
          maxLength: 500
          example: ayse@example.com
    PatchStampItemRequest:
      type: object
      required:
        - stamp_data
      additionalProperties: false
      properties:
        stamp_data:
          allOf:
            - $ref: '#/components/schemas/StampData'
          minProperties: 1
        document_id:
          type: string
          description: Verilirse kaşe bu belgede olmalıdır (çok belgeli zarf).
      example:
        stamp_data:
          companyName: Örnek Ltd.
          taxNumber: '1234567890'
          taxOffice: Kadıköy
          companyPhone: '+905551112233'
    PatchStampItemResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            item_id:
              type: integer
              example: 4821
            page_id:
              type: integer
              example: 12345
            document_id:
              type: string
              nullable: true
            party_id:
              type: string
              format: uuid
              nullable: true
            source:
              type: string
              enum:
                - INLINE
                - FILLER_PROVIDES
              description: Güncelleme sonrası kaynak (FROM_SAVED kaşe INLINE olur)
            is_required:
              type: boolean
            stamp_data:
              type: object
              description: Güncelleme sonrası kaşe verisinin tamamı.
              additionalProperties: true
    WebhookEnvelope:
      type: object
      required:
        - id
        - type
        - created_at
        - data
      description: |
        Tüm webhook payload'larının ortak zarfı. `data` alanı olay tipine
        göre değişir; her olay için ayrı veri şeması yukarıda dokümante.
      properties:
        id:
          type: string
          pattern: ^evt_[0-9a-f]{32}$
          example: evt_3a8f9c2b1d4e5f6a7b8c9d0e1f2a3b4c
          description: |
            Olay benzersiz id'si. Receiver tarafında idempotency için kullanın
            (DB'de unique key).
        type:
          type: string
          enum:
            - demand.created
            - demand.completed
            - demand.expired
            - party.signed
            - party.viewed
            - party.rejected
            - contract.expiring
            - contract.ended
            - contract.advanced
        created_at:
          type: string
          format: date-time
          description: Olay zamanı (ISO 8601 UTC).
        data:
          type: object
          description: Olay tipine özel veri (aşağıdaki şemalar)
    WebhookDataDemandCreated:
      type: object
      required:
        - demand_id
        - title
      properties:
        demand_id:
          type: string
          format: uuid
        title:
          type: string
        _backfill:
          type: boolean
          description: |
            Geçmiş event'i replay etmek için bayrak. Receiver yan etkileri
            (e-posta gönderme, ödeme tetikleme vs.) atlamalı.
    WebhookDataDemandCompleted:
      type: object
      required:
        - demand_id
        - title
        - status
        - completed_at
        - parties
      properties:
        demand_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum:
            - COMPLETED
        completed_at:
          type: string
          format: date-time
        parties:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                description: first_name + last_name
              email:
                type: string
                nullable: true
              signed_at:
                type: string
                format: date-time
                nullable: true
        _backfill:
          type: boolean
          description: Replay bayrağı (yan etkileri atla)
    WebhookDataDemandExpired:
      type: object
      required:
        - demand_id
        - title
        - expiry_date
        - parties
      properties:
        demand_id:
          type: string
          format: uuid
        title:
          type: string
        expiry_date:
          type: string
          format: date-time
        parties:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              email:
                type: string
                nullable: true
              signed:
                type: boolean
                description: Süre dolduğunda imzalamış mıydı?
    WebhookDataPartySigned:
      type: object
      required:
        - demand_id
        - party_id
      properties:
        demand_id:
          type: string
          format: uuid
        party_id:
          type: string
          format: uuid
        _backfill:
          type: boolean
          description: Replay bayrağı
    WebhookDataPartyViewed:
      type: object
      required:
        - demand_id
        - party_id
      properties:
        demand_id:
          type: string
          format: uuid
        party_id:
          type: string
          format: uuid
    WebhookDataPartyRejected:
      type: object
      required:
        - demand_id
        - party
        - rejected_at
      properties:
        demand_id:
          type: string
          format: uuid
        party:
          type: object
          required:
            - id
            - first_name
            - last_name
          properties:
            id:
              type: string
              format: uuid
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              nullable: true
            rejection_reason:
              type: string
              nullable: true
              description: Tarafın belirttiği sebep (opsiyonel, modal textarea)
        rejected_at:
          type: string
          format: date-time
    WebhookDataContractTerm:
      type: object
      required:
        - demand_id
        - term_end_date
        - renewal_type
        - notice_deadline
        - term_state
        - due_key
      description: |
        `contract.expiring` / `contract.ended` / `contract.advanced`
        olaylarının ortak verisi. Yalnız takip alanlarını taşır; taraf adı,
        e-postası veya sözleşme başlığı BU GÖVDEDE YER ALMAZ.
      properties:
        demand_id:
          type: string
          format: uuid
        term_end_date:
          type: string
          format: date
          nullable: true
          description: Olay anında platformda kayıtlı takip bitiş tarihi.
        renewal_type:
          type: string
          nullable: true
          enum:
            - AUTO_RENEW
            - FIXED_TERM
        notice_deadline:
          type: string
          format: date
          nullable: true
          description: İhbar için son gün (`term_end_date - notice_days`); tanımsızsa `null`.
        term_state:
          type: string
          enum:
            - UNTRACKED
            - ACTIVE
            - ENDED
            - STOPPED
          description: Olay anındaki takip durumu (bkz. `ContractTerm.state`).
        due_key:
          type: string
          nullable: true
          description: |
            İşçinin tekillik anahtarı (aynı olayı tekrar göndermemek için
            kullandığı dahili kayıt). Formatı sabit değildir, opak string
            olarak ele alın; idempotency için `id` alanını kullanın.
    KycWebhookEnvelope:
      type: object
      required:
        - id
        - type
        - created_at
        - data
      description: |
        KYC olaylarının zarfı. Sözleşme olaylarıyla aynı alanları taşır;
        `type` enum'u yalnız KYC olaylarını içerir.
      properties:
        id:
          type: string
          pattern: ^evt_[0-9a-f]{32}$
          example: evt_1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
          description: 'Olay id''si: receiver tarafında idempotency anahtarı.'
        type:
          type: string
          enum:
            - kyc.completed
            - kyc.failed
        created_at:
          type: string
          format: date-time
          description: Olay zamanı (ISO 8601 UTC).
        data:
          type: object
          description: Olay verisi (WebhookDataKycTerminal)
    WebhookDataKycTerminal:
      type: object
      required:
        - id
        - verified
        - methods
        - steps
        - external_ref
      description: |
        KYC terminal olay verisi. Yalnız doğrulamanın sonucunu taşır: kimlik
        numarası, telefon, ad soyad ve belge görüntüleri bu gövdede YER ALMAZ.
      properties:
        id:
          type: string
          format: uuid
          description: |
            Doğrulama kaydının kimliği. Talep oluşturulurken dönen kimlikle
            aynıdır; aynı doğrulamaya ait olayları bu değerle ilişkilendirin.
        verified:
          type: boolean
          description: Doğrulamanın toplam sonucu.
        methods:
          type: array
          items:
            type: string
          description: Talepte istenen yöntemler (örn. `id_card`, `phone_otp`).
        steps:
          type: array
          items:
            type: object
            properties:
              method:
                type: string
              verified:
                type: boolean
                nullable: true
                description: Adım sonucu; adım hiç tamamlanmadıysa `null`.
        external_ref:
          type: string
          nullable: true
          description: Talep oluşturulurken verilen dış referans.
    CodedError:
      type: object
      description: |
        `error` alanında insan-okur mesaj, `code` alanında makinece okunur
        hata kodu taşıyan hata gövdesi. Hangi kodların döndüğü ilgili yanıtın
        açıklamasında listelenir.
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Geçersiz sayfa numarası (page >= 1 olmalı)
        code:
          type: string
          example: INVALID_PAGE
        field:
          type: string
          nullable: true
          description: |
            Bazı kodlarda (ör. `TERM_INVALID`) hangi alanın reddedildiğini
            gösterir. Yalnız bu tür kodlarda bulunur; her hata gövdesinde
            YOKTUR.
    StandardError:
      type: object
      description: |
        `code`/`message` formatında standart hata gövdesi. Reminder trigger
        (`POST /api/v1/demands/{id}/reminders`) bu formatı kullanır.
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: DEMAND_NOT_FOUND
              enum:
                - INVALID_CHANNELS
                - DEMAND_NOT_FOUND
                - ALREADY_COMPLETED
                - RATE_LIMITED
                - MAX_SMS_REMINDERS_REACHED
                - DEMAND_NOT_DISPATCHED
                - DEMAND_NOT_DISPATCHABLE
                - DEMAND_EXPIRED
                - ENVELOPE_NOT_DISPATCHED
                - UNAUTHORIZED
                - INTERNAL_ERROR
            message:
              type: string
              example: Demand not found
            retry_after_seconds:
              type: integer
              description: Sadece RATE_LIMITED'de doludur
              example: 247
    TimestampRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        timestamp_time:
          type: string
          format: date-time
          description: TÜBİTAK KAMU SM'nin onayladığı damga zamanı (UTC)
        tsa_authority:
          type: string
          example: TÜBİTAK KAMU SM
          description: Zaman damgası sağlayıcısı
        file_sha256:
          type: string
          description: Damgalanan dosyanın SHA-256 hash değeri (hex, 64 karakter)
          example: a3f8b1c2d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
        verify_url:
          type: string
          format: uri
          description: Damgayı doğrulamak için URL
          example: https://imzala.org/dogrula?seri=<id>
        certificate_url:
          type: string
          format: uri
          description: Damga sertifikası URL'i
          example: https://imzala.org/dogrula?seri=<id>
        credits_used:
          type: integer
          description: Bu damga için harcanan kredi miktarı
          example: 4
        credits_remaining:
          type: integer
          description: İşlem sonrası kalan kredi bakiyesi
          example: 0
    ApiError:
      type: object
      description: |
        Standart hata zarfı. `success: false`, `error` makinece okunabilir
        hata kodu, `message` kullanıcıya dönük açıklama.
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: INSUFFICIENT_CREDITS
        message:
          type: string
          example: Yeterli krediniz yok
        code:
          type: string
          example: RATE_LIMIT_EXCEEDED
          description: İstek limiti yanıtlarında `error` ile aynı kodu taşır; diğer yanıtlarda bulunmayabilir.
        retry_after_seconds:
          type: integer
          example: 60
          description: Yalnız 429 yanıtlarında; `Retry-After` başlığıyla aynı değer.
    TimestampListItem:
      type: object
      description: |
        Zaman damgası liste/detay öğesi. `timestamp_file_url` doğrudan
        indirilebilir bir bağlantı DEĞİLDİR (dahili depolama anahtarı olabilir).
      properties:
        id:
          type: string
          format: uuid
        original_file_name:
          type: string
        original_file_size:
          type: integer
        timestamp_date:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - ACTIVE
            - VERIFIED
            - EXPIRED
            - INVALID
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        timestamp_file_url:
          type: string
    ContactSummary:
      type: object
      description: |
        Kişi (Contact) public görünümü. İç eşleşme alanları (matched_user_id /
        match_via / matched_at) ve şifreleme sütunları (*_enc / *_hash) DÂHİL
        DEĞİLDİR.
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        government_id:
          type: string
          nullable: true
        government_id_serial:
          type: string
          nullable: true
        job_title:
          type: string
          nullable: true
        company_id:
          type: string
          format: uuid
          nullable: true
        company:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        notes:
          type: string
          nullable: true
        address_country:
          type: string
          nullable: true
        address_city:
          type: string
          nullable: true
        address_district:
          type: string
          nullable: true
        address_line:
          type: string
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EnvelopeDocument:
      type: object
      description: |
        Çok-belgeli imza zarfındaki tek bir belge. `assigned_party_ids` ve
        `decision_count` yalnız `GET .../documents?view=wizard` yanıtında
        bulunur; `has_timestamp` yalnız varsayılan (özet) görünümde bulunur —
        ikisi AYNI ANDA gelmez (dashboard'un iki ayrı iç DTO'sunun
        [`EnvelopeDocumentDTO` / `EnvelopeDocumentSummaryDTO`] tek şema
        altında birleştirilmiş hâli).
      properties:
        id:
          type: string
          format: uuid
        order:
          type: integer
          description: 1'den başlar.
        title:
          type: string
        doc_kind:
          type: string
          enum:
            - CONTRACT
            - KVKK_NOTICE
            - KVKK_CONSENT
            - PREINFO
            - PRICE_LIST
            - OTHER
        is_required:
          type: boolean
        signature_required:
          type: boolean
        assigned_party_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Yalnız `?view=wizard` yanıtında bulunur.
        decision_count:
          type: integer
          description: |
            Yalnız `?view=wizard` yanıtında bulunur. Bu belge için verilmiş
            onay/red kararı sayısı.
        sealing_status:
          type: string
          enum:
            - NONE
            - PENDING
            - SEALED
            - FAILED
          nullable: true
        has_timestamp:
          type: boolean
          description: |
            Yalnız varsayılan (özet) görünümde bulunur. `sealing_status`
            `SEALED` değilken daima `false` döner.
        page_count:
          type: integer
        completed_at:
          type: string
          format: date-time
          nullable: true
        progress:
          allOf:
            - $ref: '#/components/schemas/DocumentProgress'
          description: Yalnız `GET .../documents` liste yanıtında bulunur.
        sealing:
          allOf:
            - $ref: '#/components/schemas/DocumentSealing'
          description: Yalnız `GET .../documents` liste yanıtında bulunur.
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/DocumentPartyDecision'
          description: |
            Yalnız `GET .../documents` liste yanıtında bulunur. Belge başına
            taraf kararları; `GET /api/v1/demands/{id}` yanıtındaki
            `documents[].decisions` ile aynıdır.
  responses:
    Unauthorized:
      description: API key geçersiz veya eksik
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Unauthorized
              message:
                type: string
                example: Invalid or missing X-API-Key header
    NotFound:
      description: Kayıt bulunamadı
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Şablon bulunamadı
    BadRequest:
      description: |
        Geçersiz istek. Örnek hatalar:
        - "template_id gerekli"
        - "party_mapping gerekli (en az 1 taraf)"
        - "party_mapping[0].first_name ve last_name gerekli"
        - "party_mapping[0].email veya phone gerekli"
        - "party_mapping[0].variables object olmalı"
        - "party_mapping[0].variables.adres value'su string|number|boolean|null olmali"
        - "variables object olmalı"
        - "template_party_id duplicate'i bulundu: <id>"
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: party_mapping[0].variables object olmalı
